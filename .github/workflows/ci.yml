name: ci

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

permissions:
  contents: read

jobs:
  lint-test:
    name: pytest + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip "setuptools>=83"
          pip install -r requirements.txt pip-audit

      - name: Audit Python dependencies
        run: pip-audit --local

      - name: Ruff
        run: ruff check src tests || true   # advisory, don't block M1

      - name: Mypy
        run: mypy src --ignore-missing-imports || true   # advisory, don't block M1

      - name: Pytest
        env:
          YUTE_LOCAL_STORAGE: /tmp/yute-assets-ci
        run: |
          mkdir -p "$YUTE_LOCAL_STORAGE"
          pytest -v

  node-check:
    name: TypeScript tests + audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm audit --prod

  schema-check:
    name: validate milestones
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install pyyaml pydantic
      - run: python -m scripts.validate_milestones
